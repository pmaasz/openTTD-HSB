name: build

on:
  push:
  pull_request:

jobs:
  scripts:
    name: pin + patch check + scripts (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize fresh upstream submodule
        run: git submodule update --init --depth 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify upstream pin
        run: sh scripts/fetch-upstream.sh
      - name: Check generated patch parity
        run: sh scripts/gen-patch.sh --check
      - name: Patch applies cleanly
        run: sh scripts/apply-patches.sh --check-only
      - name: Install Python deps
        run: pip install numpy pillow "mcp>=2"
      - name: Smoke-test helpers
        run: |
          python3 scripts/build-heightmap.py --check-only \
            --lat-min 47.0 --lat-max 55.5 --lon-min 4.0 --lon-max 15.5
          python3 scripts/build-manifest.py --help
          python3 scripts/build-towns.py --help
          python3 scripts/validate-scenario.py --help
          python3 mcp/test_smoke.py
      - name: Compile-check python
        run: python3 -m compileall scripts builder mcp

  builder-tests:
    name: builder unit tests (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev libpng-dev zlib1g-dev libfreetype6-dev libfluidsynth-dev
      - name: Build and run builder tests
        run: sh scripts/test-builder.sh

  upstream:
    name: upstream ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev libpng-dev zlib1g-dev libfreetype6-dev libfluidsynth-dev
      - name: Install deps (macos)
        if: runner.os == 'macOS'
        run:           brew install cmake ninja sdl2 libpng freetype fluid-synth
      - name: Install deps (windows)
        if: runner.os == 'Windows'
        run:           choco install cmake ninja -y
      - name: Apply HSB patch
        shell: bash
        run: sh scripts/apply-patches.sh
      - name: Configure
        run: cmake -S openttd-upstream -B build/upstream -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DOPTION_DEDICATED=OFF
      - name: Build
        run: cmake --build build/upstream -j 2
